[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rever-pdf"
version = "0.1.0"
description = "Leitor de PDF com narração por parágrafo usando Edge TTS"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "PyMuPDF>=1.24,<2",
    "edge-tts>=7,<8",
    "imageio-ffmpeg>=0.6,<1",
    "mutagen>=1.47,<2",
]

[project.scripts]
rever = "pdf_reader.bootstrap:main"

[tool.setuptools.packages.find]
include = ["pdf_reader*"]

[tool.setuptools.package-data]
pdf_reader = ["assets/icons/*.svg"]
